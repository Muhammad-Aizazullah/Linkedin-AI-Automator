name: Daily LinkedIn Post Automation

on:
  schedule:
    # 12:05 AM PKT is 07:05 PM UTC (previous day)
    - cron: '5 19 * * *'
    # 11:59 AM PKT is 06:59 AM UTC
    - cron: '59 6 * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend API
        run: |
          # Yahan aap k live server ka link aye ga jab deploy ho jaye
          curl -X POST https://your-app-domain.com/api/cron_trigger -H "Content-Type: application/json"