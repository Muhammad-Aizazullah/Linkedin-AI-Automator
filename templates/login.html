<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>System Access</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <header>
            <h2>System Access</h2>
        </header>
        <form action="/login" method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Username</label>
                <input type="text" name="username" style="width: 100%; padding: 10px; border: 1px solid #000; outline: none; border-radius: 0; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">Password</label>
                <input type="password" name="password" style="width: 100%; padding: 10px; border: 1px solid #000; outline: none; border-radius: 0; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%;">Login</button>
        </form>
    </div>
</body>
</html>
